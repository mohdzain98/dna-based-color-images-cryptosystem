repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^app/artifacts/vendor/  # pinned by hash, must stay byte-exact
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: debug-statements       # catch leftover breakpoint() / pdb
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Black — opinionated code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11

  # Ruff — fast linter (replaces flake8, isort, pyupgrade, and more)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]           # auto-fix safe issues (imports, etc.)
