[project]
name = "dna-color-image-cryptosystem"
version = "0.1.0"
description = "DNA based color image cryptosystem using 2D multiple collapse chaotic maps"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
